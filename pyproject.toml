[project]
name = "prospector-app"
version = "0.2.0"
description = "Prospector - describe the leads you want, and it finds, researches and qualifies them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Akshay Kharvi"}]
keywords = ["lead-generation", "sales", "research", "prospecting", "ai", "crm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
build = ["pyinstaller>=6.0"]

[project.scripts]
prospector = "prospector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospector"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
